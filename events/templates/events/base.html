<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventualy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid #eee; }
        nav .logo { font-weight: bold; font-size: 18px; }
        nav ul { list-style: none; display: flex; gap: 20px; }
        nav ul li a { text-decoration: none; color: #333; font-size: 14px; }
    </style>
</head>
<body>
<nav>
    <div class="logo">Eventualy</div>
    <ul>
        <li><a href="{% url 'index' %}">Home</a></li>
        <li><a href="{% url 'ask_for_event' %}">Ask for event</a></li>
    </ul>
</nav>
{% block content %}{% endblock %}
</body>
</html>
