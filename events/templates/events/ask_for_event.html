{% extends 'events/base.html' %}
{% block content %}
<style>
    .form-container { max-width: 500px; margin: 40px auto; padding: 30px; }
    .red { width: 50px; height: 50px; background: red; }
    .outline { width: 50px; height: 50px; border: 2px solid black; margin-top: -30px; margin-left: 20px; margin-bottom: 20px; }
    h2 { font-size: 32px; margin-bottom: 10px; }
    p.desc { color: #555; margin-bottom: 25px; font-size: 14px; }
    input, textarea { width: 100%; border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    .btn { background: #111; color: white; padding: 12px 25px; border: none; cursor: pointer; font-size: 14px; float: right; }
</style>
<div class="form-container">
    <div class="red"></div>
    <div class="outline"></div>
    <h2>Ask for event</h2>
    <p class="desc">Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Event Name" required>
        <input type="datetime-local" name="date_time" required>
        <input type="file" name="poster" accept="image/*">
        <input type="text" name="bands" placeholder="Bands (comma separated)">
        <label><input type="checkbox" name="is_outdoor"> Outdoor event</label>
        <br><br>
        <button type="submit" class="btn">Add event</button>
    </form>
</div>
{% endblock %}
